plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

description = 'Business application module for the financial account challenge'

dependencies {
    api 'org.springframework.boot:spring-boot-starter-data-jpa:4.1.1'
    api 'org.springframework.boot:spring-boot-starter-validation:4.1.1'
    implementation 'org.springframework.retry:spring-retry:2.0.13'
    runtimeOnly 'ch.qos.logback:logback-classic:1.6.5'
    compileOnly "org.projectlombok:lombok:${rootProject.lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${rootProject.lombokVersion}"
    testImplementation 'org.springframework.boot:spring-boot-starter-test:4.1.1'
    testCompileOnly "org.projectlombok:lombok:${rootProject.lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${rootProject.lombokVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.ow2.asm:asm:9.11'
}
