spring.application.name=financial-account-api
spring.main.banner-mode=off

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/financial_account}
spring.datasource.username=${DATABASE_USERNAME:financial_account}
spring.datasource.password=${DATABASE_PASSWORD:financial_account}
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '3s'

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
