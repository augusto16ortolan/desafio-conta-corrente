services:
  postgres:
    image: postgres:17-alpine
    container_name: financial-account-postgres
    environment:
      POSTGRES_DB: financial_account
      POSTGRES_USER: financial_account
      POSTGRES_PASSWORD: financial_account
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_account -d financial_account"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
